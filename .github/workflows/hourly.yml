name: Hourly Gold Signal

on:
  schedule:
    # Toutes les heures, à la minute 0 (heure UTC)
    - cron: "0 * * * *"
  workflow_dispatch: {}  # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write  # nécessaire pour que le workflow puisse commiter le log

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le cycle d'analyse
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Enregistrer le log de décision dans le repo
        run: |
          git config user.name "gold-agent-bot"
          git config user.email "actions@github.com"
          git add logs/decisions.csv pending_signal.json
          git diff --staged --quiet || git commit -m "Log décision $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
